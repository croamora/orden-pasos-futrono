  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --text: #101828;
      --muted: #5f6b7f;
      --line: #d5dce8;
      --pending: #fff5de;
      --done: #ddf5e6;
      --done-border: #15803d;
      --pending-border: #b7791f;
      --accent: #0f4ba8;
      --accent-weak: #dbeafe;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #d8e6ff 0%, transparent 50%),
        radial-gradient(900px 500px at 90% -20%, #e8f7ed 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .wrap {
      max-width: 1320px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid #cfd8e7;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(8, 31, 66, 0.09);
    }

    header {
      padding: 28px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #f9fbff 0%, #f5f8ff 100%);
    }

    h1 {
      margin: 0 0 8px;
      font-family: "Sora", sans-serif;
      font-size: clamp(1.3rem, 1.9vw, 2rem);
      letter-spacing: -0.02em;
    }

    .meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: #44506a;
      font-size: 0.95rem;
    }

    .stat {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border: 1px solid #d8e1ef;
      border-radius: 999px;
      background: #ffffffcc;
      font-size: 0.86rem;
      font-weight: 600;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="search"] {
      width: 360px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 0.95rem;
      outline: none;
      background: #ffffff;
    }

    input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(25, 88, 209, 0.15);
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: transform 180ms cubic-bezier(0.32, 0.72, 0, 1), border-color 180ms ease, background-color 180ms ease;
    }

    button:hover {
      border-color: #9ab4e5;
      transform: translateY(-1px);
    }

    button[data-active="true"] {
      background: var(--accent-weak);
      border-color: #92b3e7;
      color: #0f356f;
    }

    .table-wrap {
      width: 100%;
      overflow: auto;
      max-height: calc(100vh - 300px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1020px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 11px 10px;
      text-align: left;
      font-size: 0.92rem;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #eef3ff;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #41506f;
    }

    tr.pending {
      background: var(--pending);
      box-shadow: inset 4px 0 0 var(--pending-border);
    }

    tr.done {
      background: var(--done);
      box-shadow: inset 4px 0 0 var(--done-border);
    }

    tr:not(.time-row):not(.break-row) {
      transition: background-color 220ms ease;
    }

    tr.time-row td {
      background: #edf2ff;
      color: #2f436f;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    tr.break-row td {
      background: #faf7ee;
      color: #78601d;
      font-weight: 600;
    }

    .small { color: var(--muted); font-size: 0.82rem; margin-top: 10px; }
    .pass-col { text-align: center; width: 70px; }

    input[type="checkbox"] {
      width: 19px;
      height: 19px;
      accent-color: #197246;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      header { padding: 16px; }
      h1 { font-size: 1.12rem; }
      .meta { font-size: 0.85rem; }
      body { padding: 10px; }
      .stat { padding: 6px 10px; }
    }
  </style>
</head>

    const tbody = document.getElementById("tbody");
    const search = document.getElementById("search");
    const countTotal = document.getElementById("countTotal");
    const countDone = document.getElementById("countDone");
    const countPending = document.getElementById("countPending");
    const showAllBtn = document.getElementById("showAll");
    const showPendingBtn = document.getElementById("showPending");
    const showDoneBtn = document.getElementById("showDone");
    const clearAllBtn = document.getElementById("clearAll");

    let statusMap = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    let filterMode = "all";

    const normalize = (s) => (s || "").toLowerCase();

    function rowKey(item, index) {
      return `${item.n}-${item.nombre}-${item.club}-${index}`;
    }

    function updateCounters() {
      const competitors = rows.filter((r) => r.n);
      const done = competitors.filter((item, idx) => statusMap[rowKey(item, rows.indexOf(item))]).length;
      const total = competitors.length;
      countTotal.textContent = `Total: ${total}`;
      countDone.textContent = `Pasaron: ${done}`;
      countPending.textContent = `Faltan: ${total - done}`;
    }

    function render() {
      const q = normalize(search.value.trim());
      tbody.innerHTML = "";

      rows.forEach((item, index) => {
        if (item.type === "time" || item.type === "break") {
          const trInfo = document.createElement("tr");
          trInfo.className = item.type === "time" ? "time-row" : "break-row";
          const td = document.createElement("td");
          td.colSpan = 7;
          td.textContent = item.label;
          trInfo.appendChild(td);
          tbody.appendChild(trInfo);
          return;
        }

        const key = rowKey(item, index);
        const isDone = !!statusMap[key];
        const hay = normalize(`${item.n} ${item.nombre} ${item.club} ${item.categoria} ${item.implemento} ${item.hora}`);

        if (q && !hay.includes(q)) return;
        if (filterMode === "pending" && isDone) return;
        if (filterMode === "done" && !isDone) return;

        const tr = document.createElement("tr");
        tr.className = isDone ? "done" : "pending";

        tr.innerHTML = `
          <td>${item.n}</td>
          <td>${item.nombre}</td>
          <td>${item.club}</td>
          <td>${item.categoria}</td>
          <td>${item.implemento}</td>
          <td>${item.hora}</td>
          <td class="pass-col"><input type="checkbox" ${isDone ? "checked" : ""} aria-label="Marcar ${item.nombre}" /></td>
        `;

        const check = tr.querySelector("input");
        check.addEventListener("change", (e) => {
          statusMap[key] = e.target.checked;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(statusMap));
          render();
        });

        tbody.appendChild(tr);
      });

      updateCounters();
    }

    function setFilterMode(mode) {
      filterMode = mode;
      showAllBtn.dataset.active = mode === "all";
      showPendingBtn.dataset.active = mode === "pending";
      showDoneBtn.dataset.active = mode === "done";
      render();
    }

    showAllBtn.addEventListener("click", () => {
      setFilterMode("all");
    });

    showPendingBtn.addEventListener("click", () => {
      setFilterMode("pending");
    });

    showDoneBtn.addEventListener("click", () => {
      setFilterMode("done");
    });

    clearAllBtn.addEventListener("click", () => {
      if (!confirm("Se eliminaran todas las marcas guardadas. Continuar?")) return;
      statusMap = {};
      localStorage.removeItem(STORAGE_KEY);
      render();
    });

    search.addEventListener("input", render);
    render();
  </script>
